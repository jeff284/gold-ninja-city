<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gold Ninja">
<meta name="theme-color" content="#0f1b3d">
<title>Gold Ninja City</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<style>
:root{--bg:#0f1b3d;--card:#fff;--ink:#1b2340;--muted:#5b6585;--gold:#f5b400;--gold-d:#a86f00;--gold-l:#ffe27a;--red:#e5484d;--blue:#3e63dd;--teal:#12a594;--green:#2f9e62;--soft:#eef1fb;--line:#d9def0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{background:radial-gradient(1200px 640px at 50% -12%,#2a4290 0%,var(--bg) 62%) fixed}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none}
#app{min-height:100%;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;padding-block:4px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto;width:100%}
/* HUD */
.hud{display:flex;align-items:center;gap:12px;padding:12px 2px}
.hud-title{flex:1;color:#fff;font-weight:800;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:rgba(255,255,255,.14);color:#fff;border-radius:16px;width:56px;height:56px;font-size:26px;flex:none}
.card .icon-btn{background:var(--soft);color:var(--ink)}
.hud-right{display:flex;gap:10px;align-items:center}
.nug{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.28);color:var(--gold-l);font-weight:800;font-size:24px;padding:6px 14px 6px 10px;border-radius:999px}
.nugget{width:34px;height:28px;flex:none}
.fp-mini{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.28);padding:9px 12px;border-radius:999px;color:#fff}
.fp-lab{color:var(--gold);font-size:20px;line-height:1}
.fp-dots{display:flex;gap:4px}.fp-dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.25)}
.fp-dots i.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.fp-pend{background:var(--red);color:#fff;font-weight:800;border-radius:999px;padding:0 8px;font-size:15px}
/* generic */
.card{background:var(--card);border-radius:28px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.btn{border-radius:20px;padding:16px 26px;font-weight:800;font-size:22px;background:var(--soft)}
.btn.big{font-size:28px;padding:18px 34px;min-height:76px}
.btn.gold{background:linear-gradient(180deg,#ffd84d,#f5b400);color:#3b2a00;box-shadow:0 5px 0 #b07800}
.btn.gold:active{transform:translateY(3px);box-shadow:0 2px 0 #b07800}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn:disabled{opacity:.4}
.center-col{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 0}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
/* splash + home */
.splash{align-items:center;justify-content:center;text-align:center;color:#fff}
.splash svg{width:170px;height:190px;animation:bounce 2.2s infinite}
.splash h1{font-size:58px;margin:8px 0 0}.splash p{font-size:26px;opacity:.85;margin:6px 0 26px}
.home{display:flex;flex-direction:column;gap:20px;flex:1}
.hero{display:flex;align-items:center;gap:18px;color:#fff}
.hero svg{width:100px;height:110px;flex:none}
.hero h1{margin:0;font-size:44px}.hero p{margin:4px 0 0;font-size:22px;opacity:.85}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:18px;flex:1}
.tile{border-radius:30px;padding:24px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;min-height:180px;color:#fff;text-align:left;box-shadow:0 8px 0 rgba(0,0,0,.28);position:relative;overflow:hidden}
.tile:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.28)}
.t-ico{font-size:64px;position:absolute;top:16px;right:20px}
.t-name{font-size:34px;font-weight:900}.t-sub{font-size:20px;opacity:.92}
.t-dojo{background:linear-gradient(135deg,#f5b400,#d86f00)}.t-duel{background:linear-gradient(135deg,#e5484d,#9e1f33)}
.t-forge{background:linear-gradient(135deg,#12a594,#0a6158)}.t-garage{background:linear-gradient(135deg,#3e63dd,#283b9c)}
.t-zh{background:linear-gradient(135deg,#ff5d8f,#b8326b)}
.tiles .t-garage{grid-column:1/-1;min-height:130px}
/* Fruit Chant */
.zh{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:start}
.zh-card{display:flex;flex-direction:column;gap:12px;min-height:380px}
.zh-side{display:flex;flex-direction:column;gap:14px}
.zh-stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0}
.zh-big-fruit{font-size:120px;line-height:1}.zh-big-fruit.sm{font-size:84px}
.zh-label{display:flex;flex-direction:column;align-items:center}
.zh-hz{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;font-size:42px;font-weight:800;line-height:1.15}
.zh-hz.sm{font-size:24px}.zh-hz.huge{font-size:110px;color:var(--ink)}
.zh-py{font-size:18px;color:var(--muted);font-weight:700}
.zh-py.reveal{visibility:hidden}.zh-py.reveal.on{visibility:visible}
.zh-q{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;font-size:30px;font-weight:900;text-align:center;text-wrap:balance}
.zh-q small{display:block;font-family:inherit;font-size:20px;color:var(--muted);font-weight:700}
.bubble{background:var(--soft);border-radius:22px;padding:12px 18px;font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;font-size:30px;font-weight:800;text-align:center}
.bubble small{display:block;font-size:17px;color:var(--muted);font-weight:700}
.zh-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
.zh-opt{background:var(--soft);border-radius:22px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 5px 0 var(--line);min-height:124px;color:var(--ink)}
.zh-opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.zh-opt.nope{opacity:.35;pointer-events:none}
.zh-opt.right{background:#dff5e7;box-shadow:0 5px 0 #9fd8b4}
.blob{display:inline-block;width:76px;height:76px;border-radius:50%;background:var(--c);box-shadow:inset 0 -8px 14px rgba(0,0,0,.25),inset 0 6px 10px rgba(255,255,255,.35),0 0 0 3px rgba(0,0,0,.1);flex:none}
.zh-fruit-e{font-size:62px;line-height:1}
.dot-hint{display:none;width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.show-dots .dot-hint{display:block}
.name-hint{display:none}.show-names .name-hint{display:block}
.story-map{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;font-size:38px}
.story-map .arrow{font-size:22px;color:var(--muted)}
.story-map .q,.mix-row .q{font-size:30px;font-weight:900;color:var(--gold-d);border:3px dashed var(--gold);border-radius:14px;padding:0 12px}
.mix-row{display:flex;align-items:center;gap:12px;font-size:40px;font-weight:900;color:var(--ink)}
.mix-bar{width:100%;height:34px;border-radius:999px;background:linear-gradient(90deg,var(--a),var(--b))}
.zh-praise small{display:block;font-size:18px;color:var(--muted)}
.bowl-card{text-align:center}
.bowl{font-size:40px;min-height:70px;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:2px;background:radial-gradient(ellipse at 50% 100%,#fff3cc,#fffdf5 70%);border-radius:0 0 90px 90px;border:4px solid #f0d58a;border-top:0;padding:8px 12px}
.bowl span{animation:drop .5s ease-out}
@keyframes drop{from{transform:translateY(-40px);opacity:0}}
.zh-intro .zh-fruits{font-size:50px;letter-spacing:4px}
.next-slot:empty{display:none}
@media (orientation:portrait),(max-width:900px){.zh{grid-template-columns:1fr}}
.parent-link{align-self:center;color:rgba(255,255,255,.6);font-size:18px;padding:12px 18px}
.intro{text-align:center;max-width:560px;width:100%}
.intro svg{width:110px;height:120px}.intro h2{font-size:44px;margin:6px 0}.intro p{font-size:24px;margin:0 0 22px}
/* dojo */
.dojo,.duel{display:grid;grid-template-columns:1fr 360px;gap:18px;flex:1;align-items:start}
.forge{display:grid;grid-template-columns:1fr 240px;gap:18px;flex:1;align-items:start}
@media (orientation:portrait),(max-width:900px){.dojo,.duel,.forge{grid-template-columns:1fr}.input-area,.duel-ctrl{justify-self:center;width:100%;max-width:520px}}
.prob{display:flex;flex-direction:column;gap:14px;min-height:400px}
.prob-head{display:flex;align-items:center;gap:12px;width:100%}
.chip{background:var(--ink);color:var(--gold-l);font-weight:800;padding:8px 16px;border-radius:999px;font-size:20px;white-space:nowrap}
.dots{flex:1;display:flex;gap:8px;justify-content:center}.dots i{width:16px;height:16px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--gold)}.dots i.now{background:var(--blue);box-shadow:0 0 0 4px rgba(62,99,221,.25)}
.big-eq{font-size:62px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums}
.big-eq:empty{display:none}
.story{font-size:28px;line-height:1.45;margin:0;font-weight:600}
.blank{display:inline-block;min-width:1.1em;border-bottom:6px solid var(--blue);color:var(--blue);text-align:center}
.step-q{font-size:40px;font-weight:800;text-align:center;background:var(--soft);border-radius:20px;padding:14px}
.step-q:empty{display:none}
.work{display:flex;flex-direction:column;gap:4px;align-items:center}
.done-line{font-size:24px;color:var(--green);font-weight:700}
.msg{font-size:26px;font-weight:800;text-align:center;min-height:34px}
.praise{display:block}
.earn{display:inline-flex;align-items:center;gap:6px;color:var(--gold-d);margin-top:8px;font-size:30px}
.help:empty{display:none}
.help{background:#fff8dc;border:3px dashed var(--gold);border-radius:20px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.tip{font-size:22px;margin:0;text-align:center}
.visual{display:flex;flex-direction:column;align-items:center;gap:12px}
.visual:empty{display:none}
.frames{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.frame{display:grid;grid-template-columns:repeat(5,40px);grid-template-rows:repeat(2,40px);border:4px solid var(--ink);border-radius:8px;background:#fff}
.frame>span{border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}
.dot::before{content:"";width:28px;height:28px;border-radius:50%;background:var(--blue);display:block}
.dot.hi::before{background:var(--gold);box-shadow:0 0 0 3px #fff0a0}
.dot.x::before{opacity:.22}
.dot.x::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--red);font-weight:900;font-size:30px}
.rows{display:flex;flex-direction:column;gap:8px}.rows .r{display:flex;gap:8px}
.rows .d{width:30px;height:30px;border-radius:50%;background:var(--blue)}.rows .d.extra{background:var(--gold)}
.bond{display:flex;flex-direction:column;align-items:center}
.b-top,.b-c{width:72px;height:72px;border-radius:50%;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;background:#fff}
.b-lines{width:170px;height:34px}.b-lines line{stroke:var(--ink);stroke-width:3}
.b-row{display:flex;gap:70px}
.q{color:var(--blue)!important;background:#e6ecff!important;border-style:dashed!important}
.barm{width:min(520px,100%);display:flex;flex-direction:column;gap:6px}
.bar-lab{font-size:15px;color:var(--muted);font-weight:800;letter-spacing:1px;text-align:center}
.bar-whole,.bar-p{height:58px;border:4px solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}
.bar-whole{background:#fff3c4}.bar-parts{display:flex;gap:6px}.bar-p{background:#dfe7ff;min-width:0}.bar-p.b2{background:#d5f5ec}
.nl{width:min(620px,100%);height:auto}.nl-axis{stroke:var(--ink);stroke-width:4}.nl-tick{stroke:var(--ink);stroke-width:2}
.nl-num{font-size:18px;text-anchor:middle;fill:var(--muted);font-weight:700}.nl-num.strong{fill:var(--ink);font-size:22px;font-weight:900}
.nl-arc{fill:none;stroke:var(--gold-d);stroke-width:4}.nl-lab{font-size:20px;font-weight:900;fill:var(--gold-d);text-anchor:middle}
.scale{position:relative;width:min(560px,100%);height:150px;margin:0 auto}
.beam{position:absolute;left:0;right:0;top:26px;display:flex;justify-content:space-between;border-top:8px solid var(--ink);border-radius:4px;transition:transform .9s;transform-origin:50% 0}
.pan{margin-top:10px;background:#e6ecff;border:4px solid var(--ink);border-radius:0 0 30px 30px;padding:10px 14px;font-size:28px;font-weight:900;min-width:140px;text-align:center}
.post{position:absolute;left:50%;top:26px;width:10px;height:118px;margin-left:-5px;background:var(--ink);border-radius:4px}
/* pad + choices */
.input-area{display:flex;flex-direction:column;gap:14px}
.pad,.choices{background:var(--card);border-radius:28px;padding:16px;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.pad-display{height:84px;border-radius:18px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900;margin-bottom:12px}
.pad-val.empty{color:#b9c0d9}
.pad-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:76px;border-radius:18px;background:var(--soft);font-size:38px;font-weight:900;box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key-go{background:var(--green);color:#fff;box-shadow:0 4px 0 #1d6b42}.key-del{font-size:30px}
.pad-lock{display:none}
.locked>.pad-lock{display:flex;position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.86);align-items:center;justify-content:center;font-size:28px;font-weight:800;color:var(--muted);z-index:2}
.choices{display:flex;flex-direction:column;gap:14px}
.choice{background:var(--soft);font-size:26px;padding:20px;border-radius:20px;box-shadow:0 4px 0 var(--line);font-weight:800}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.next{width:100%}
/* overlays */
.ask .ask-card{max-width:560px;width:100%;color:var(--ink);text-align:left}
.ask-card p{font-size:22px;line-height:1.35;margin:0 0 20px}
.ask-row{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
.sync-note{color:var(--muted);font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b2340;color:#fff;padding:14px 20px;border-radius:16px;font-size:18px;font-weight:700;z-index:60;width:max-content;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.icon-btn.ping,.say-target.ping{animation:ping .5s ease-out}
@keyframes ping{40%{transform:scale(1.2);background:var(--gold-l)}}
@media (prefers-reduced-motion:reduce){.icon-btn.ping,.say-target.ping{animation:none}}
.overlay{position:fixed;inset:0;background:rgba(15,27,61,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50;color:#fff;text-align:center;padding:20px}
.breath-circle{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#ffe27a,#f5b400);animation:breath 3.4s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(.6)}50%{transform:scale(1.25)}}
.breath-text{font-size:46px;font-weight:900}.breath-sub{font-size:24px;opacity:.9}
.move{align-items:center;justify-content:center}
.move-card{background:var(--card);border-radius:32px;padding:36px;text-align:center;max-width:620px;width:100%}
.move-emoji{font-size:110px;animation:bounce 1s infinite}.move-card h2{font-size:36px;margin:8px 0}.move-text{font-size:32px;font-weight:800;margin:0 0 24px}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
/* celebrate */
.celebrate{text-align:center;max-width:680px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
.goal{position:relative;width:300px;height:140px}
.net{position:absolute;right:0;top:0;width:170px;height:120px}
.ball{position:absolute;left:0;bottom:0;font-size:54px;animation:kick 1.1s cubic-bezier(.3,.7,.4,1) forwards}
@keyframes kick{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(190px,-64px) rotate(720deg)}}
.gooal{font-size:64px;margin:0;color:var(--gold-d);animation:pop .5s .9s both}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.15)}100%{transform:scale(1)}}
.earn-big{display:flex;align-items:center;gap:10px;font-size:44px;font-weight:900;color:var(--gold-d)}
.earn-big .nugget{width:56px;height:46px}
.sum{font-size:24px;margin:0}
.fp-box{background:var(--soft);border-radius:20px;padding:14px 20px;width:100%}
.fp-box p{margin:8px 0 0;font-size:22px;font-weight:700}
.fp-big{display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:800;flex-wrap:wrap}
.fp-big i{width:34px;height:34px;border-radius:50%;background:var(--line);display:inline-block}
.fp-big i.on{background:radial-gradient(circle at 35% 35%,#fff3a3,#f5b400 60%,#b07800)}
/* badges */
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.coin{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;background:radial-gradient(circle at 30% 30%,#fff7c2 0%,#ffd84d 30%,#f5b400 60%,#a86f00 100%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),0 0 0 5px #ffe27a,0 6px 16px rgba(0,0,0,.3);position:relative;overflow:hidden}
.coin::after{content:"";position:absolute;top:-30%;left:-60%;width:40%;height:160%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);transform:rotate(25deg);animation:shine 2.8s infinite}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
.badge.off .coin{background:#d9def0;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08);filter:grayscale(1);opacity:.5}
.badge.off .coin::after{display:none}
.b-name{font-weight:800;font-size:18px}.b-desc{font-size:14px;color:var(--muted)}
.new-badges{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
/* duel */
.players{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.pl{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px}.pl svg{width:50px;height:56px}
.vs{font-weight:800;color:var(--muted);text-align:center}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.cell{aspect-ratio:1;border-radius:18px;background:var(--soft);font-size:36px;font-weight:900;box-shadow:0 4px 0 var(--line)}
.cell.me{background:linear-gradient(180deg,#ffd84d,#f5b400);color:#3b2a00;box-shadow:0 4px 0 #b07800}
.cell.bot{background:linear-gradient(180deg,#ff7a7e,#e5484d);color:#fff;box-shadow:0 4px 0 #a32034}
.cell.glow{outline:6px solid var(--green);outline-offset:-3px;animation:glow .8s infinite alternate}
.cell.last{outline:4px dashed var(--ink);outline-offset:-2px}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.07)}}
.duel-ctrl{display:flex;flex-direction:column;gap:14px}
.duel-ctrl .pad,.duel-ctrl .choices{box-shadow:none;padding:0}
.dice{display:flex;gap:16px;justify-content:center}
.die{width:84px;height:84px;background:#fff;border:4px solid var(--ink);border-radius:18px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:8px}
.die span{display:flex;align-items:center;justify-content:center}

<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================
   Gold Ninja City — a 1st-grade learning game (math, words, Mandarin colors)
   Single-file iPad web app. Progress saves to the Claude account when hosted on claude.ai, else this browser.
   ========================================================= */

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const el = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const sayExpr = s => String(s).replace(/\+/g, ' plus ').replace(/−/g, ' minus ').replace(/=/g, ' equals ');
const app = document.getElementById('app');
let SCREEN = 0;
function show(node) { SCREEN++; app.innerHTML = ''; app.appendChild(node); window.scrollTo(0, 0); return SCREEN; }

/* ---------- saved state ---------- */
const KEY = 'goldNinja.v1';
function defaults() {
  return {
    nuggets: 0, earned: 0, cars: [], badges: {},
    c: { streak: 0, fixed: 0, split: 0, mystery: 0, story: 0, words: 0, duelWins: 0, zh: 0 },
    day: { date: '', missions: 0 },
    fp: { progress: 0, pending: 0, approved: 0, todayDate: '', today: 0 },
    settings: { perPoint: 3, cap: 2, pin: '1234', pinSet: false, sfx: true, name: '' },
    skill: {}, log: [], approvals: [], forgeNext: 0
  };
}
function deepMerge(d, s) {
  for (const k in s) {
    if (s[k] && typeof s[k] === 'object' && !Array.isArray(s[k]) && d[k] && typeof d[k] === 'object' && !Array.isArray(d[k])) d[k] = deepMerge(d[k], s[k]);
    else d[k] = s[k];
  }
  return d;
}
function load() { try { const raw = localStorage.getItem(KEY); if (raw) return deepMerge(defaults(), JSON.parse(raw)); } catch (e) {} return defaults(); }
function save() { S.updatedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} queueCloud(); }
let S = load();
// The player's name is set in Parent Corner and kept on this device only, so the app itself holds no personal details.
const kidName = () => ((S.settings && S.settings.name) || '').trim() || 'Ninja';
const escHTML = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

/* ---------- cloud save ----------
   On claude.ai, progress is also saved to the signed-in account (private to that account),
   so it survives Safari clearing site data and shows up on any device signed in to it.
   Anywhere else it stays in this browser only. */
const SYNC = { ref: null, mode: 'local', writing: false, dirty: false, timer: 0 };
function queueCloud() { if (!SYNC.ref) return; clearTimeout(SYNC.timer); SYNC.timer = setTimeout(flushCloud, 1200); }
async function flushCloud() {
  if (!SYNC.ref) return;
  if (SYNC.writing) { SYNC.dirty = true; return; }
  SYNC.writing = true; SYNC.dirty = false;
  try { await SYNC.ref.set({ state: JSON.parse(JSON.stringify(S)), updatedAt: S.updatedAt || 0 }); SYNC.mode = 'cloud'; }
  catch (e) {
    const code = e && e.code;
    if (code === 'unavailable' || code === 'resource_exhausted') { SYNC.dirty = false; clearTimeout(SYNC.timer); SYNC.timer = setTimeout(flushCloud, 6000); }
    else { SYNC.ref = null; SYNC.mode = 'local'; }
  }
  SYNC.writing = false;
  if (SYNC.dirty) flushCloud();
}
function adoptCloud(data) {
  if (!data || !data.state || typeof data.state !== 'object') return;
  if ((data.updatedAt || 0) <= (S.updatedAt || 0)) return;
  S = deepMerge(defaults(), JSON.parse(JSON.stringify(data.state)));
  S.updatedAt = data.updatedAt;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (app.querySelector('.home')) home();
  else if (app.querySelector('.parent') && !(document.activeElement && document.activeElement.classList.contains('pin'))) parentScreen();
}
async function startCloud() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc('data/users/' + uid + '/goldNinja');
    let confirmed = false;
    ref.onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites) return;
      if (snap.exists) adoptCloud(snap.data());
      if (!confirmed && !snap.metadata.fromCache) {
        confirmed = true; SYNC.ref = ref; SYNC.mode = 'cloud';
        const remoteT = snap.exists ? (snap.data().updatedAt || 0) : -1;
        if (remoteT < (S.updatedAt || 0) || !snap.exists) flushCloud();
      }
    }, () => { SYNC.ref = null; SYNC.mode = 'local'; });
  } catch (e) {}
}
function onClaude(fn) { if (window.claude) fn(); else setTimeout(() => { if (window.claude) fn(); }, 800); }
onClaude(startCloud);

/* ---------- in-page yes/no box (pop-up dialogs are blocked on claude.ai) ---------- */
function askConfirm(msg, yes = 'Yes', no = 'Cancel') {
  return new Promise(resolve => {
    const o = el(`<div class="overlay ask" role="dialog" aria-modal="true"><div class="card ask-card"><p></p><div class="ask-row">${no ? '<button class="btn ghost no"></button>' : ''}<button class="btn gold yes"></button></div></div></div>`);
    o.querySelector('p').textContent = msg;
    o.querySelector('.yes').textContent = yes;
    if (no) o.querySelector('.no').textContent = no;
    const done = v => { o.remove(); resolve(v); };
    o.querySelector('.yes').onclick = () => done(true);
    if (no) o.querySelector('.no').onclick = () => done(false);
    document.body.appendChild(o);
    o.querySelector('.yes').focus();
  });
}
const tell = msg => askConfirm(msg, 'OK', null);

/* ---------- speech (iPad built-in voice) ---------- */
let voice = null, zhVoice = null, speechToken = 0, partsRun = 0;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => /en-US/i.test(v.lang) && /Samantha|Ava|Allison|Nicky|Susan|Zoe/i.test(v.name)) || vs.find(v => /en-US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
    zhVoice = vs.find(v => /zh[-_]CN/i.test(v.lang) && /Tingting|Ting-Ting|Lili|Yu-shu/i.test(v.name)) || vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
  } catch (e) {}
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let TTS = null, voiceOff = false, lastVoiceStart = 0;
function stopSpeech() { speechToken++; partsRun++; try { speechSynthesis.cancel(); } catch (e) {} try { if (TTS && TTS.active()) TTS.stop().catch(() => {}); } catch (e) {} }
// Claude's own voice, where the viewer offers it (desktop app, Chrome). Safari on the iPad uses the iPad's voice.
async function startTTS() {
  try {
    const t = await window.claude.use('tts');
    if (!t) return;
    TTS = t;
    t.onState(e => { if (e.state === 'speaking') lastVoiceStart = Date.now(); });
  } catch (e) {}
}
const quietWait = text => sleep(Math.min(3500, 500 + text.length * 40));
onClaude(startTTS);
function browserSpeak(text, tok, zh) {
  return new Promise(res => {
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    if (!('speechSynthesis' in window)) { setTimeout(fin, Math.min(3500, 500 + text.length * 40)); return; }
    try { speechSynthesis.cancel(); } catch (e) {}
    setTimeout(() => {
      if (tok !== speechToken) return fin();
      try {
        const u = new SpeechSynthesisUtterance(text);
        if (zh) { if (zhVoice) u.voice = zhVoice; u.lang = 'zh-CN'; u.rate = 0.8; }
        else { if (voice) u.voice = voice; u.lang = 'en-US'; u.rate = 0.9; u.pitch = 1.05; }
        u.onstart = () => { lastVoiceStart = Date.now(); }; u.onend = fin; u.onerror = fin;
        speechSynthesis.speak(u);
      } catch (e) { fin(); }
    }, 60);
    setTimeout(fin, 2500 + text.length * (zh ? 300 : 85)); // safety net if the browser never reports "end"
  });
}
function speak(text, zh = false) {
  const tok = ++speechToken;
  if (voiceOff) return quietWait(text); // the viewer turned reading aloud off for this page
  if (TTS) {
    try { speechSynthesis.cancel(); } catch (e) {}
    return TTS.speak(text, { rate: zh ? 0.85 : 0.9, language: zh ? 'zh' : 'en' }).then(() => {}, e => {
      const code = e && e.code;
      if (code === 'not_granted') { voiceOff = true; return quietWait(text); }
      if (code === 'stopped' || tok !== speechToken) return;
      return browserSpeak(text, tok, zh);
    });
  }
  return browserSpeak(text, tok, zh);
}
// Say a list of English and Mandarin pieces in order: [{ en: 'Tap it.' }, { zh: '红色' }].
// Resolves true if it finished, false if something else spoke or speech was stopped.
async function sayParts(parts) {
  const run = ++partsRun;
  for (const p of parts) {
    if (run !== partsRun) return false;
    await speak(p.zh || p.en, !!p.zh);
  }
  return run === partsRun;
}
// The 🔊 buttons: always give feedback, and say so when this window has no voice.
function sayAgain(btn, text) {
  if (!text) return;
  btn.classList.remove('ping'); void btn.offsetWidth; btn.classList.add('ping');
  SFX.tap();
  const asked = Date.now();
  if (Array.isArray(text)) sayParts(text); else speak(text);
  setTimeout(() => {
    if (lastVoiceStart >= asked) return;
    toast(voiceOff ? 'Reading aloud is turned off for this page. Turn it back on in the page\'s Permissions menu.'
      : 'No voice in this window. Read-aloud works on the iPad in Safari, or in Chrome.');
  }, 2200);
}
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = el('<div class="toast" role="status"></div>'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 4500);
}

/* ---------- 8-bit sound effects ----------
   Made live with Web Audio in the style of the NES sound chip: two pulse channels
   (12.5%, 25% and 50% duty cycles), a triangle bass, a noise channel (plus its
   short "metallic" mode), stepped volume envelopes, pitch sweeps, vibrato and fast
   arpeggios. Every melody here is original. */
const SFX = (() => {
  let ctx = null, out = null, noiseBuf = null, metalBuf = null;
  const waves = {};
  const enabled = () => !(S.settings && S.settings.sfx === false);
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function init() {
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        out = ctx.createGain(); out.gain.value = 0.3;
        const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 40;
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 10000;
        out.connect(hp); hp.connect(lp); lp.connect(ctx.destination);
        const sr = ctx.sampleRate;
        noiseBuf = ctx.createBuffer(1, sr, sr);
        const d = noiseBuf.getChannelData(0); let v = 0;
        for (let i = 0; i < sr; i++) { if (i % 4 === 0) v = Math.random() < .5 ? -1 : 1; d[i] = v; }
        const pat = range(1, 93).map(() => (Math.random() < .5 ? -1 : 1));
        metalBuf = ctx.createBuffer(1, 93 * 6, sr);
        const m = metalBuf.getChannelData(0);
        for (let i = 0; i < m.length; i++) m[i] = pat[Math.floor(i / 6)];
      }
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    } catch (e) { ctx = null; }
    return ctx;
  }
  function pulse(duty) {
    if (waves[duty]) return waves[duty];
    const n = 48, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(Math.PI * k * duty);
    return (waves[duty] = ctx.createPeriodicWave(re, im));
  }
  function env(g, t0, dur, vol, decay) {
    g.gain.setValueAtTime(vol, t0);
    if (decay) for (let i = 1; i <= 8; i++) g.gain.setValueAtTime(vol * (1 - i / 9), t0 + dur * i / 8.5);
    g.gain.setValueAtTime(0, t0 + dur);
  }
  // one note: wave is a duty cycle (pulse) or 'tri'; m is a MIDI note number
  function tone(t0, { m, f, dur = .1, vol = .5, wave = .5, toM, to, decay = true, vib = 0, vibDepth = .03 }) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    if (wave === 'tri') o.type = 'triangle'; else o.setPeriodicWave(pulse(wave));
    const f0 = f || hz(m);
    o.frequency.setValueAtTime(f0, t0);
    const f1 = to || (toM !== undefined ? hz(toM) : 0);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    if (vib) {
      const l = ctx.createOscillator(), lg = ctx.createGain();
      l.frequency.value = vib; lg.gain.value = f0 * vibDepth;
      l.connect(lg); lg.connect(o.frequency); l.start(t0); l.stop(t0 + dur + .05);
    }
    env(g, t0, dur, vol, decay);
    o.connect(g); g.connect(out); o.start(t0); o.stop(t0 + dur + .03);
  }
  function noise(t0, { dur = .1, vol = .4, rate = 1, toRate, metal = false, hp = 0, lp = 0, decay = true }) {
    const s = ctx.createBufferSource(), g = ctx.createGain();
    s.buffer = metal ? metalBuf : noiseBuf; s.loop = true;
    s.playbackRate.setValueAtTime(rate, t0);
    if (toRate) s.playbackRate.exponentialRampToValueAtTime(toRate, t0 + dur);

  let val = '';

  const render = () => { disp.textContent = raw ? (val ? '•'.repeat(val.length) : '?') : (val || '?'); disp.classList.toggle('empty', !val); };
  render();
  w.addEventListener('click', e => {
    const b = e.target.closest('.key'); if (!b || w.classList.contains('locked')) return;
    const k = b.dataset.k;
    if (k === 'del') { SFX.del(); val = val.slice(0, -1); }
    else if (k === 'go') { if (val !== '') { SFX.tap(); onSubmit(raw ? val : parseInt(val, 10)); } return; }
    else if (val.length < maxLen) { SFX.key(k); val = (val === '0' && !raw ? '' : val) + k; }
    render();
  });
  return { el: w, lock() { w.classList.add('locked'); }, unlock() { if (w.classList.contains('locked') && !raw) SFX.ready(); w.classList.remove('locked'); }, clear() { val = ''; render(); } };
}

/* ---------- Dice Duel (class "Connect Four" dice game) ---------- */
const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
function duel() {
  const nums = shuffle([0, ...range(1, 12), ...range(1, 12)]);
  const Bd = range(0, 4).map(r => range(0, 4).map(c => ({ v: nums[r * 5 + c], o: null })));
  const M = { area: 'Dice Duel', nuggets: 0, first: 0, fixed: 0, breaths: 0, badges: [], count: 0 };
  const v = el(`<div class="screen">${hudHTML('Dice Duel')}<div class="duel">
    <div class="card"><div class="players"><div class="pl">${ninjaSVG('#f5b400')}<span>You</span></div><div class="vs">4 in a row wins!</div><div class="pl">${ninjaSVG('#e5484d')}<span>Red Ninja</span></div></div><div class="board"></div></div>
    <div class="card duel-ctrl"><div class="dice"><div class="die"></div><div class="die"></div></div><div class="duel-msg"></div><div class="duel-input"></div></div>
  </div></div>`);
  const sid = show(v); bindHud(v);
  const alive = () => sid === SCREEN;
  const boardEl = v.querySelector('.board'), dice = [...v.querySelectorAll('.die')], msg = v.querySelector('.duel-msg'), inp = v.querySelector('.duel-input');
  let d1 = 1, d2 = 1, turn = 'me', glowVal = null, lastCell = null, unlockAt = 0, breaths = 0, rounds = 0;
  const tried = new Set();
  dice[0].innerHTML = pips(1); dice[1].innerHTML = pips(1);
  function render() {
    boardEl.innerHTML = '';
    Bd.forEach((row, r) => row.forEach((cell, c) => {
      const glow = glowVal !== null && cell.v === glowVal && cell.o !== 'me';
      const last = lastCell && lastCell[0] === r && lastCell[1] === c;
      const b = el(`<button class="cell ${cell.o || ''}${glow ? ' glow' : ''}${last ? ' last' : ''}">${cell.v}</button>`);
      b.onclick = () => claim(r, c); boardEl.appendChild(b);
    }));
  }
  const runLen = (r, c, o) => { let best = 1; for (const [dr, dc] of DIRS) { let n = 1; for (const sg of [1, -1]) { let rr = r + dr * sg, cc = c + dc * sg; while (rr >= 0 && rr < 5 && cc >= 0 && cc < 5 && Bd[rr][cc].o === o) { n++; rr += dr * sg; cc += dc * sg; } } best = Math.max(best, n); } return best; };
  const hasFour = o => { for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) { if (Bd[r][c].o !== o) continue; for (const [dr, dc] of DIRS) { let n = 1, rr = r + dr, cc = c + dc; while (rr >= 0 && rr < 5 && cc >= 0 && cc < 5 && Bd[rr][cc].o === o) { n++; rr += dr; cc += dc; } if (n >= 4) return true; } } return false; };
  async function roll() { SFX.roll(); for (let k = 0; k < 8; k++) { dice[0].innerHTML = pips(rnd(1, 6)); dice[1].innerHTML = pips(rnd(1, 6)); await sleep(70); } d1 = rnd(1, 6); d2 = rnd(1, 6); dice[0].innerHTML = pips(d1); dice[1].innerHTML = pips(d2); }
  function myTurn() {
    if (!alive()) return;
    rounds++;
    if (rounds > 12) return endGame('time');
    turn = 'me'; glowVal = null; tried.clear(); render();
    msg.textContent = 'Your turn! Roll the dice.'; inp.innerHTML = '';
    const rb = el('<button class="btn big gold" style="width:100%">🎲 Roll</button>'); inp.appendChild(rb);
    rb.onclick = async () => { rb.remove(); await roll(); chooseOp(); };
  }
  async function chooseOp() {
    const opts = ['+', '−'].filter(o => !tried.has(o));
    inp.innerHTML = '';
    const box = el(`<div class="choices locked">${opts.map(o => `<button class="choice" data-o="${o}">${o === '+' ? '➕ Add' : '➖ Subtract'}</button>`).join('')}<div class="pad-lock">👂 Listen first…</div></div>`);
    inp.appendChild(box);
    msg.textContent = `You rolled ${d1} and ${d2}.`;
    await speak(tried.size ? 'Try the other way!' : `You rolled ${d1} and ${d2}. Add or subtract? Look for a number you want on the board.`);
    if (!alive()) return;
    box.classList.remove('locked'); SFX.ready();
    box.onclick = e => { const b = e.target.closest('.choice'); if (b) { SFX.select(); compute(b.dataset.o); } };
  }
  async function compute(op) {
    tried.add(op);
    const hi = Math.max(d1, d2), lo = Math.min(d1, d2), a = op === '+' ? d1 : hi, b = op === '+' ? d2 : lo, ans = op === '+' ? a + b : a - b;
    inp.innerHTML = ''; msg.innerHTML = `<span class="duel-eq">${a} ${op} ${b} = ${B_}</span>`;
    let tries = 0;
    const pad = makePad({ maxLen: 2, onSubmit: async val => {
      const fast = Date.now() - unlockAt < 1500; pad.lock();
      if (val === ans) {
        SFX.correct(); M.count++; if (tries === 0) M.first++; else M.fixed++;
        stat('duel', { first: tries === 0, fixed: tries > 0 });
        S.nuggets += 1; S.earned += 1; M.nuggets += 1; save(); updateHud();
        msg.innerHTML = `<span class="duel-eq">${a} ${op} ${b} = <b>${ans}</b></span>`;
        const avail = Bd.flat().some(c => c.v === ans && c.o !== 'me');
        if (avail) { glowVal = ans; render(); inp.innerHTML = `<p class="hint">Tap a glowing ${ans} to claim it!</p>`; speak(`${ans}! Tap a glowing ${ans}.`); }
        else if (!tried.has(op === '+' ? '−' : '+')) { inp.innerHTML = ''; await speak(`${ans}. You already have all the ${ans}s.`); if (alive()) chooseOp(); }
        else { inp.innerHTML = ''; await speak('No spots for that one. Red Ninja\'s turn.'); if (alive()) botTurn(); }
        return;
      }
      tries++; pad.clear();
      if (!(fast && breaths < 2)) SFX.check();
      if (fast && breaths < 2) { breaths++; M.breaths++; await ninjaBreath(); }
      else if (tries === 1) {
        inp.querySelector('.help')?.remove();
        inp.insertAdjacentHTML('afterbegin', `<div class="help">${op === '+' ? twoRows(a, b) : frames(a, { cross: new Set(range(a - b, a - 1)) })}</div>`);
        await speak(op === '+' ? `Let's check. ${a} and ${b} more. Count all the dots.` : `Let's check. Start with ${a} and take away ${b}.`);
      } else { await speak(`It's ${ans}. Type ${ans}.`); }
      if (!alive()) return; pad.unlock(); unlockAt = Date.now();
    } });
    inp.appendChild(pad.el);
    await speak(`${a} ${op === '+' ? 'plus' : 'minus'} ${b}?`); if (!alive()) return;
    pad.unlock(); unlockAt = Date.now();
  }
  async function claim(r, c) {
    if (turn !== 'me' || glowVal === null) return;
    const cell = Bd[r][c]; if (cell.v !== glowVal || cell.o === 'me') return;
    const bumped = cell.o === 'bot'; cell.o = 'me'; lastCell = [r, c]; glowVal = null; turn = 'wait'; render(); inp.innerHTML = '';
    if (bumped) SFX.bump(); else SFX.claim();
    if (hasFour('me')) return endGame('me');
    await speak(bumped ? 'Bump! You knocked Red Ninja off!' : 'Got it!'); if (!alive()) return;
    botTurn();
  }
  async function botTurn() {
    turn = 'bot'; glowVal = null; render(); inp.innerHTML = ''; msg.textContent = 'Red Ninja\'s turn…';
    await sleep(700); if (!alive()) return; await roll();
    const s = d1 + d2, df = Math.abs(d1 - d2), cands = [];
    Bd.forEach((row, r) => row.forEach((cell, c) => { if (cell.o !== 'bot' && (cell.v === s || cell.v === df)) cands.push({ r, c, v: cell.v }); }));
    if (!cands.length) { msg.textContent = `Red Ninja rolled ${d1} and ${d2}. No spots!`; await speak(`Red Ninja rolled ${d1} and ${d2}. No spots! Your turn.`); return myTurn(); }
    let ch;
    // Kept deliberately beatable for a 1st grader: half the time Red Ninja just picks any spot,
    // prefers empty spots over bumping, and only sometimes blocks.
    if (Math.random() < .5) ch = pick(cands);
    else { cands.forEach(k => { const mine = runLen(k.r, k.c, 'bot'), block = runLen(k.r, k.c, 'me'); k.sc = mine * 3 + (block >= 4 && Math.random() < .5 ? 20 : 0) + (Bd[k.r][k.c].o === null ? 2 : 0) + (mine >= 4 ? 100 : 0) + Math.random() * 3; }); ch = cands.sort((x, y) => y.sc - x.sc)[0]; }
    const plus = ch.v === s, hi = Math.max(d1, d2), lo = Math.min(d1, d2);
    const bumped = Bd[ch.r][ch.c].o === 'me'; Bd[ch.r][ch.c].o = 'bot'; lastCell = [ch.r, ch.c]; render();
    if (bumped) SFX.ouch(); else SFX.bot();
    msg.textContent = `Red Ninja: ${plus ? `${d1} + ${d2} = ${s}` : `${hi} − ${lo} = ${df}`}`;
    await speak(`Red Ninja rolled ${d1} and ${d2}. ${plus ? `${d1} plus ${d2} is ${s}.` : `${hi} minus ${lo} is ${df}.`}${bumped ? ' Bump! Red Ninja knocked you off!' : ''}`);
    if (!alive()) return;
    if (hasFour('bot')) return endGame('bot');
    myTurn();
  }
  async function endGame(w) {
    turn = 'over';
    let won = w === 'me';
    if (w === 'time') { const mine = Bd.flat().filter(c => c.o === 'me').length, his = Bd.flat().filter(c => c.o === 'bot').length; won = mine > his; w = won ? 'me' : 'bot'; }
    const bonus = won ? 5 : 3; S.nuggets += bonus; S.earned += bonus; M.nuggets += bonus;
    if (won) { S.c.duelWins++; award('duel', M.badges); }
    save(); updateHud();
    msg.textContent = won ? 'You win the duel!' : 'Red Ninja wins this one.';
    if (won) SFX.win(); else SFX.lose();
    await sleep(won ? 1900 : 1100); if (!alive()) return;
    await speak(won ? 'You win the Dice Duel! Great math, ninja!' : 'Red Ninja wins this time. Good battle, ninja! Your math was strong.');
    if (!alive()) return;
    M.summary = `${won ? 'You beat Red Ninja!' : 'Good battle!'} ${M.first} facts right on the first try`;
    M.summarySay = `${won ? 'You beat Red Ninja!' : 'Good battle!'} You got ${M.first} facts right on the first try${M.fixed ? ` and fixed ${M.fixed}` : ''}.`;
    await sleep(500); celebrate(M, duel);
  }
  speak('Dice Duel! Roll the dice, add or subtract, and claim that number. Get four in a row to win. You can bump Red Ninja off!').then(() => myTurn());
  render(); msg.textContent = 'Get 4 in a row to win!';
}

/* ---------- Word Forge (change one sound) ---------- */
const CHAINS = [
  [['c', 'a', 't'], ['b', 'a', 't'], ['b', 'a', 'g'], ['b', 'i', 'g'], ['p', 'i', 'g'], ['p', 'i', 'n'], ['f', 'i', 'n'], ['f', 'a', 'n']],
  [['p', 'u', 'p'], ['c', 'u', 'p'], ['c', 'a', 'p'], ['t', 'a', 'p'], ['t', 'i', 'p'], ['l', 'i', 'p'], ['l', 'i', 'ck'], ['k', 'i', 'ck']],
  [['f', 'o', 'g'], ['l', 'o', 'g'], ['d', 'o', 'g'], ['d', 'i', 'g'], ['d', 'i', 'p'], ['s', 'i', 'p'], ['sh', 'i', 'p'], ['sh', 'o', 'p']],
  [['s', 'a', 'd'], ['s', 'a', 'ck'], ['b', 'a', 'ck'], ['p', 'a', 'ck'], ['p', 'i', 'ck'], ['th', 'i', 'ck'], ['th', 'i', 'n'], ['w', 'i', 'n']],
  [['h', 'u', 'sh'], ['r', 'u', 'sh'], ['r', 'u', 'g'], ['b', 'u', 'g'], ['b', 'e', 'g'], ['l', 'e', 'g'], ['l', 'e', 't'], ['g', 'e', 't']],
  [['d', 'i', 'm'], ['h', 'i', 'm'], ['h', 'i', 'd'], ['l', 'i', 'd'], ['l', 'i', 't'], ['h', 'i', 't'], ['h', 'o', 't'], ['p', 'o', 't']]
];
const VOW = ['a', 'e', 'i', 'o', 'u'];
const CONS = ['b', 'c', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'm', 'n', 'p', 'r', 's', 't', 'v', 'w', 'z', 'sh', 'ck', 'th'];
const BRICK_COLORS = ['#e5484d', '#f5b400', '#3e63dd', '#2f9e62', '#ff8b3d', '#8e4ec6', '#12a594'];
function forge() {
  const chain = CHAINS[S.forgeNext % CHAINS.length]; S.forgeNext++; save();
  const M = { area: 'Word Forge', nuggets: 0, first: 0, fixed: 0, breaths: 0, badges: [], count: 0 };
  let i = 0, word = chain[0].slice(), phase = 'pos', pos = 0, target = null, wrongThis = 0, breathed = false, unlockAt = 0, locked = true, lastSay = '';
  const v = el(`<div class="screen">${hudHTML('Word Forge')}<div class="forge">
    <div class="card forge-main"><div class="prob-head"><span class="chip">Word Forge</span><span class="dots">${chain.slice(1).map(() => '<i></i>').join('')}</span><button class="icon-btn say" aria-label="Say it again">🔊</button></div>
      <div class="tiles-word"></div><div class="target"></div><div class="msg"></div><div class="letter-bank"></div></div>
    <div class="card tower-card"><div class="tower"></div><p class="tower-lab">Word Tower</p></div></div></div>`);
  const sid = show(v); bindHud(v);
  const alive = () => sid === SCREEN;
  const wordEl = v.querySelector('.tiles-word'), tgtEl = v.querySelector('.target'), msg = v.querySelector('.msg'), bank = v.querySelector('.letter-bank'), tower = v.querySelector('.tower');
  v.querySelector('.say').onclick = e => sayAgain(e.currentTarget, lastSay);
  const posName = () => pos === 0 ? 'beginning' : pos === word.length - 1 ? 'end' : 'middle';
  function renderWord(sel, pulse) { wordEl.innerHTML = word.map((t, k) => `<button class="wtile${VOW.includes(t) ? ' v' : ''}${sel === k ? ' sel' : ''}${pulse === k ? ' pulse' : ''}" data-k="${k}">${t}</button>`).join(''); }
  function renderDots() { v.querySelectorAll('.dots i').forEach((d, k) => d.className = k < i ? 'done' : k === i ? 'now' : ''); }
  async function say(t) { locked = true; lastSay = t; await speak(t); if (!alive()) return false; locked = false; unlockAt = Date.now(); return true; }
  async function step() {
    target = chain[i + 1]; pos = target.findIndex((t, k) => t !== word[k]); phase = 'pos'; wrongThis = 0; breathed = false;
    renderDots(); renderWord(); bank.innerHTML = '';
    const cur = word.join(''), tgt = target.join('');
    tgtEl.innerHTML = `Change <b>${cur}</b> to <button class="say-target">🔊 ?</button>`;
    tgtEl.querySelector('.say-target').onclick = e => sayAgain(e.currentTarget, tgt);
    msg.textContent = 'Which part changes? Tap it.';
    await say(`This word is ${cur}. Change ${cur} to ${tgt}. Which part changes? Tap it.`);
  }
  async function rushCheck() { if (Date.now() - unlockAt < 1300 && !breathed) { breathed = true; M.breaths++; locked = true; await ninjaBreath(); return true; } return false; }
  wordEl.onclick = async e => {
    const b = e.target.closest('.wtile'); if (!b || locked || phase !== 'pos') return;
    const k = +b.dataset.k, tgt = target.join('');
    if (k === pos) {
      phase = 'letter'; renderWord(pos); SFX.select();

      msg.textContent = `Which letter makes ${tgt}?`;
      await say(`Yes! The ${posName()} changes. Which letter makes ${tgt}?`);
      return;
    }
    wrongThis++; SFX.check();

    if (wrongThis === 1) await say(`Listen: ${word.join('')}. ${tgt}. Is it the beginning, the middle, or the end that sounds different?`);

  };

    const l = b.dataset.l, tgt = target.join('');
    if (l === target[pos]) {
      locked = true; const old = word[pos]; SFX.brick(); setTimeout(SFX.correct, 160); word = target.slice(); renderWord(); bank.innerHTML = '';
      const first = wrongThis === 0; stat('words', { first, fixed: !first, breaths: breathed ? 1 : 0 });
      if (first) M.first++; else M.fixed++;
      M.count++; S.c.words++; S.nuggets += 1; S.earned += 1; M.nuggets += 1;
      if (S.c.words >= 20) award('words', M.badges);
      save(); updateHud();
      tower.insertAdjacentHTML('beforeend', `<div class="brick" style="background:${BRICK_COLORS[i % BRICK_COLORS.length]}">${tgt}</div>`);
      msg.textContent = `${tgt}! You changed ${old} to ${l}.`;
      await speak(`${tgt}! You changed ${old} to ${l}.`); if (!alive()) return;
      i++;
      if (i < chain.length - 1) step();
      else {
        renderDots(); M.summary = `${M.count} words built`; M.summarySay = `You built ${M.count} words, and your word tower is huge!`;
        celebrate(M, forge);
      }
      return;
    }
    wrongThis++; SFX.check();
    if (await rushCheck()) { if (alive()) await say(`Listen again. ${tgt}. Which letter makes the sound at the ${posName()}?`); return; }
    if (wrongThis === 1) await say(`Not quite. Listen: ${tgt}. ${tgt}. What sound do you hear at the ${posName()}?`);
    else { bank.querySelectorAll('.ltile').forEach(t => t.classList.toggle('pulse', t.dataset.l === target[pos])); await say(`It's ${target[pos]}. Tap the glowing letter.`); }
  };
  renderWord();
  speak('Word Forge! Change one sound to make a new word. Ready?').then(() => alive() && step());
}

const MIXES = [['red', 'yellow', 'orange'], ['yellow', 'blue', 'green'], ['red', 'blue', 'purple']];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function zhBuild(R) {
  if (R.kind === 'color') {
    const f = FRUITS[R.fi], c = ZC[f.color];
    const opts = shuffle([f.color, ...shuffle(FRUITS.map(x => x.color).filter(x => x !== f.color)).slice(0, 3)]);
    return {
      answer: f.color, skill: 'zhRead', dots: true,
      stage: `<div class="zh-big-fruit">${f.e}</div><div class="zh-label"><span class="zh-hz">${f.zh}</span><span class="zh-py">${f.py} · ${f.en}</span></div>`,
      q: '这是什么颜色？<small>What color is it? Read the words.</small>',
      opts: opts.map(id => ({ v: id, html: hzHTML(ZC[id]), label: ZC[id].en })),
      say: [{ zh: `这是${f.zh}。这是什么颜色？` }, { en: 'What color is it? Read the color words, then tap.' }],
      hint: [{ en: `Let's check. The ${f.en} ${f.pl ? 'are' : 'is'} ${c.en}. Listen.` }, { zh: c.zh }, { en: 'Look for the dots to help you.' }],
      done: [{ zh: `${c.zh}的${f.zh}！` }],
      praise: `${c.zh}的${f.zh}! ${cap(c.en)} ${f.en}!`

  }
  if (R.kind === 'next') {
    const f = FRUITS[R.fi], c = ZC[f.color], last = R.fi === FRUITS.length - 1;
    const ans = last ? 'salad' : String(R.fi + 1);
    const pool = FRUITS.map((_, k) => String(k)).filter(k => k !== ans && k !== String(R.fi)).concat(last ? [] : ['salad']);
    const opts = shuffle([ans, ...shuffle(pool).slice(0, 2)]).map(v => fruitOpt(v === 'salad' ? v : +v));
    const nf = last ? null : FRUITS[R.fi + 1];
    const line1 = `${c.zh}的${f.zh}，你在想什么？`;
    const line2 = last ? '我在想水果沙拉！是不是很好吃？' : `我在想${ZC[nf.color].zh}的${nf.zh}，是不是很好吃？`;
    return {
      answer: ans, skill: 'zhChant',
      stage: `<div class="zh-big-fruit sm">${f.e}</div><div class="bubble">${line1}<small>${cap(c.en)} ${f.en}, what are you thinking of?</small></div>`,
      q: 'What comes next in the chant?',
      opts,
      say: [{ zh: line1 }, { en: `${cap(c.en)} ${f.en}, what are you thinking of? Tap the next fruit.` }],
      hint: [{ en: 'Remember the chant order.' }, ...FRUITS.slice(0, R.fi + 1).map(x => ({ zh: `${ZC[x.color].zh}的${x.zh}` })), { en: 'What comes next?' }],
      help: `<div class="story-map">${FRUITS.map((x, k) => k <= R.fi ? `<span>${x.e}</span>` : k === R.fi + 1 ? '<span class="q">?</span>' : '').join('<span class="arrow">→</span>').replace(/(<span class="arrow">→<\/span>)+$/, '')}${last ? '<span class="arrow">→</span><span class="q">?</span>' : ''}</div>`,
      done: [{ zh: line2 }],
      praise: `${line2}<br><small>${last ? 'I am thinking of a fruit salad! Yummy!' : `I'm thinking of ${ZC[nf.color].en} ${nf.en}. Yummy!`}</small>`,
      addFruit: f.e
    };
  }
  if (R.kind === 'hear') {
    const c = ZC[R.c];
    const opts = shuffle([c.id, ...shuffle(ZH_COLORS.map(x => x.id).filter(x => x !== c.id)).slice(0, 3)]);
    return {
      answer: c.id, skill: 'zhHear', names: true,
      stage: '<div class="zh-big-fruit">👂</div>', q: 'Tap the color you hear.',
      opts: opts.map(id => ({ v: id, html: blobHTML(ZC[id]), label: ZC[id].en })),
      say: [{ zh: c.zh }, { en: 'Tap that color.' }],
      hint: [{ en: 'Listen again.' }, { zh: c.zh }, { en: `That means ${c.en}. The color words are under the paint now.` }],
      done: [{ zh: `这是${c.zh}！` }],
      praise: `这是${c.zh}! That's ${c.en}!`
    };
  }
  if (R.kind === 'read') {
    const c = ZC[R.c];
    const opts = shuffle([c.id, ...shuffle(ZH_COLORS.map(x => x.id).filter(x => x !== c.id)).slice(0, 3)]);
    return {
      answer: c.id, skill: 'zhRead',
      stage: `<div class="zh-hz huge">${c.zh}</div><div class="zh-py reveal">${c.py}</div>`, q: 'Read it! Which color is this?',
      opts: opts.map(id => ({ v: id, html: `<span class="blob" style="--c:${ZC[id].hex}"></span>`, label: ZC[id].en })),
      say: [{ en: 'Read it! Which color is this?' }],
      hint: [{ en: 'Listen.' }, { zh: c.zh }, { en: `That means ${c.en}.` }],
      done: [{ zh: c.zh }, { en: `means ${c.en}!` }],
      praise: `${c.zh} means ${c.en}!`
    };
  }
  // mix: two primary colors make a secondary color (三原色 → 二次色)
  const [a, b, r] = R.mix.map(id => ZC[id]);
  return {
    answer: r.id, skill: 'zhMix', dots: true,
    stage: `<div class="mix-row"><span class="blob" style="--c:${a.hex}"></span>+<span class="blob" style="--c:${b.hex}"></span>=<span class="q">?</span></div><div class="zh-q">${a.zh} + ${b.zh}</div>`,
    q: 'Mix them! What color do they make?',
    opts: shuffle(['orange', 'green', 'purple']).map(id => ({ v: id, html: `<span class="blob" style="--c:${ZC[id].hex}"></span><span class="zh-hz sm">${ZC[id].zh}</span>`, label: ZC[id].en })),
    say: [{ zh: `${a.zh}加${b.zh}` }, { en: `${cap(a.en)} plus ${b.en}. Mix them! What color do they make?` }],
    hint: [{ en: `Think of mixing paint. ${cap(a.en)} and ${b.en} together make a new color.` }],
    help: `<div class="mix-bar" style="--a:${a.hex};--b:${b.hex}"></div>`,
    done: [{ zh: `${a.zh}加${b.zh}是${r.zh}！` }, { en: 'Two primary colors make a secondary color!' }],
    praise: `${a.zh} + ${b.zh} = ${r.zh}! <small>${cap(a.en)} + ${b.en} = ${r.en}</small>`
  };
}

function zhMission(mode) {

const SPIN_MOVES = ['zoom', 'fly', 'climb', 'jump'];
function showPower(card, c, quiet) {
  if (!card || card.classList.contains('fx')) return;
  const pw = c.power, cls = ['fx', 'fx-' + pw.move].concat(SPIN_MOVES.includes(pw.move) ? ['fx-spin'] : []);
  card.classList.add(...cls);
  const bits = [];
  for (let i = 0; i < 12; i++) {
    let dx, dy;
    if (pw.dir === 'trail') { dx = -60 - Math.random() * 90; dy = -25 + Math.random() * 40; }
    else if (pw.dir === 'spray') { dx = 50 + Math.random() * 90; dy = -50 + Math.random() * 40; }
    else if (pw.dir === 'up') { dx = -60 + Math.random() * 120; dy = -70 - Math.random() * 60; }
    else if (pw.dir === 'fall') { dx = -70 + Math.random() * 140; dy = 50 + Math.random() * 50; }
    else { const a = Math.random() * Math.PI * 2, r = 50 + Math.random() * 60; dx = Math.cos(a) * r; dy = Math.sin(a) * r; }
    const b = el(`<span class="particle${pw.dir === 'fall' ? ' from-top' : ''}" aria-hidden="true">${pw.p}</span>`);
    b.style.setProperty('--dx', dx.toFixed(0) + 'px'); b.style.setProperty('--dy', dy.toFixed(0) + 'px'); b.style.setProperty('--d', (Math.random() * .6).toFixed(2) + 's');
    card.appendChild(b); bits.push(b);
  }
  (SFX[pw.sfx] || SFX.claim)();
  if (!quiet) speak(`${c.name}! Superpower: ${pw.name}!`);
  setTimeout(() => { card.classList.remove(...cls); bits.forEach(b => b.remove()); }, 1900);
}

  v.querySelectorAll('.stepper button[data-s]').forEach(b => b.onclick = () => {
    const k = b.dataset.s, lim = k === 'perPoint' ? [1, 10] : [0, 10];
    st[k] = Math.min(lim[1], Math.max(lim[0], st[k] + +b.dataset.d));
    if (k === 'perPoint' && fp.progress >= st.perPoint) fp.progress = st.perPoint - 1;
    save(); parentScreen();
  });
  v.querySelector('.save-pin').onclick = () => {
    const p = v.querySelector('.pin').value.trim();
    if (!/^\d{4,6}$/.test(p)) { tell('Use 4 to 6 digits for the PIN.'); return; }
    S.settings.pin = p; S.settings.pinSet = true; save(); parentScreen(); tell('PIN saved.');
  };
  v.querySelector('.save-name').onclick = () => {
    S.settings.name = v.querySelector('.kid-name').value.replace(/[<>]/g, '').trim().slice(0, 16);
    save(); parentScreen(); tell(S.settings.name ? `Name saved. Hi, ${S.settings.name}!` : 'Name cleared. The game will say "Ninja".');
  };
  v.querySelector('.sfx-toggle').onclick = () => { S.settings.sfx = S.settings.sfx === false; save(); parentScreen(); SFX.select(); };
  v.querySelector('.reset').onclick = async () => {
    if (!await askConfirm('Erase all progress, nuggets, cars and badges on this device?', 'Erase')) return;
    if (!await askConfirm('Are you sure? This cannot be undone.', 'Yes, erase it all')) return;
    const keep = S.settings; S = defaults(); S.settings = keep; save(); parentScreen();
  };
}

splash();
// Works offline once installed: the service worker keeps a copy of the app on the iPad.
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
